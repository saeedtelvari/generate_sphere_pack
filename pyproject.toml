[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poropack"
version = "2.0.0"
authors = [
  { name="Saeed Telvari" },
]
description = "High-performance 3D porous media generation, diagenetic modeling, and petrophysical characterization for Digital Rock Physics"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "matplotlib>=3.5",
    "pandas>=1.4",
    "scikit-image>=0.19",
    "tifffile>=2022.0.0",
]

[project.optional-dependencies]
drp = [
    "porespy>=2.0",
    "pyvista>=0.38",
    "vtk>=9.0",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["poropack*"]
